<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Padrón - Junta JSYBYPE</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body{font-family:system-ui;background:#f1f5f9;padding:16px}
  .card{background:white;padding:18px;border-radius:14px;max-width:480px;margin:auto;box-shadow:0 2px 8px #0001}
  label{font-size:13px;font-weight:700;color:#475569}
  input{width:100%;padding:12px;margin:6px 0 14px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px;box-sizing:border-box}
  button{width:100%;padding:14px;background:#16a34a;color:white;border:0;border-radius:10px;font-size:17px;font-weight:800}
  .topbar{display:flex;gap:8px;margin-bottom:10px}
  .topbar button{width:auto;flex:1;padding:12px 6px;font-size:15px}
  .ok{background:#dcfce7;color:#166534;padding:10px;border-radius:8px;margin-top:12px;display:none}
  .err{background:#fee2e2;color:#991b1b;padding:10px;border-radius:8px;margin-top:12px;display:none}
  .hint{font-size:12px;color:#64748b;margin-top:-10px;margin-bottom:12px}
</style>
</head>
<body>
<div class="card">
<h2 style="margin:0">Nuevo Socio</h2>
<p style="color:#64748b;margin:6px 0 16px">Junta de Saneamiento - Tarifa fija 25.000 Gs</p>
<input id="buscarCedula" type="text" placeholder="C.I. a editar Ej: 656565" inputmode="numeric">
<div class="topbar">
  <button onclick="buscarParaEditar()">✏️ Editar</button>
  <button onclick="cancelar()" style="background:#f59e0b">❌ Cancelar</button>
  <button onclick="salir()" style="background:#dc3545">🚪 Salir</button>
</div>
<p id="modoEditar" style="color:#d97706;font-weight:bold;display:none;">✏️ Editando socio - Guardar para actualizar</p>

<label>Nombre *</label>
<input id="nombre" placeholder="Ej: Juan">

<label>Apellido *</label>
<input id="apellido" placeholder="Ej: Benítez">

<label>Cédula *</label>
<input id="cedula" placeholder="Ej: 5123456" inputmode="numeric">

<label>Teléfono / WhatsApp *</label>
<input id="telefono" placeholder="Ej: 0981 123456" inputmode="tel">

<label>Dirección / Compañía</label>
<input id="direccion" placeholder="Ej: Santa Rosa - Centro">

<label>Nro. Cuenta *</label>
<input id="cuenta" placeholder="Ej: 001" inputmode="numeric">

<label>Nro. Medidor (opcional - a futuro)</label>
<input id="medidor" placeholder="Dejar vacío si no tiene">
<div class="hint">Hoy la Junta NO usa medidor. Dejá vacío, se guarda como "Sin medidor".</div>

<button onclick="guardar()">Guardar Socio</button>
<div id="ok" class="ok"></div>
<div id="err" class="err"></div>

<p id="contador" style="text-align:center;color:#475569;font-size:14px"></p>
</div>

<script>
const db = window.supabase.createClient(
  'https://zbwpsemyeejebpfkaepz.supabase.co',
  'sb_publishable_dxeFPiwiG1Fjvp7kS8vqOw_bY6kYNXE'
);

let editandoPersonaId = null;
let editandoClienteId = null;

async function actualizarContador(){
  const {count} = await db.from('clientes').select('*',{count:'exact',head:true});
  document.getElementById('contador').textContent = 'Socios cargados: ' + (count||0) + ' / 150';
}
actualizarContador();

  async function buscarParaEditar() {
  const cedulaBuscar = document.getElementById('buscarCedula').value.trim();
  if (!cedulaBuscar) { alert('Escribí una C.I. Ej: 6033725'); return; }
  
  const { data: persona } = await db.from('personas').select('*').eq('cedula_ruc', cedulaBuscar).single();
  if (!persona) { alert('No existe esa C.I.'); return; }
  
  const { data: cliente } = await db.from('clientes').select('*').eq('persona_id', persona.id).single();
  
  document.getElementById('nombre').value = persona.nombre;
  document.getElementById('apellido').value = persona.apellido;
  document.getElementById('cedula').value = persona.cedula_ruc;
  document.getElementById('telefono').value = persona.telefono || '';
  document.getElementById('direccion').value = persona.direccion || '';
  // Si no tiene cuenta, deja el campo vacío para que le pongas una
  document.getElementById('cuenta').value = cliente ? cliente.nro_cuenta : '';
  document.getElementById('medidor').value = cliente ? (cliente.numero_medidor || '') : '';
  
  editandoPersonaId = persona.id;
  editandoClienteId = cliente ? cliente.id : null;
  
  document.getElementById('modoEditar').style.display = 'block';
  document.getElementById('ok').textContent = cliente ? '✏️ Cargado para editar: ' + persona.nombre : '⚠️ Esta persona NO tenía cuenta, poné una cuenta y Guardar para recuperarla';
  document.getElementById('ok').style.display = 'block';
}  
    
function cancelar() {
  ['nombre', 'apellido', 'cedula', 'telefono', 'direccion', 'cuenta', 'medidor', 'buscarCedula', 'buscarCuenta'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = '';
  });
  editandoPersonaId = null;
  editandoClienteId = null;
  document.getElementById('modoEditar').style.display = 'none';
  document.getElementById('ok').style.display = 'none';
  document.getElementById('err').style.display = 'none';
}

async function salir(){
  await db.auth.signOut();
  window.location.href = 'login.html';
}

async function guardar(){
  const nombre = document.getElementById('nombre').value.trim();
  const apellido = document.getElementById('apellido').value.trim();
  const cedula = document.getElementById('cedula').value.trim();
  const telefono = document.getElementById('telefono').value.trim();
  const direccion = document.getElementById('direccion').value.trim();
  const cuenta = document.getElementById('cuenta').value.trim();
  const medidorRaw = document.getElementById('medidor').value.trim();
  const medidor = medidorRaw === '' ? null : medidorRaw;

  const okEl = document.getElementById('ok');
  const errEl = document.getElementById('err');
  okEl.style.display='none'; errEl.style.display='none';

  if(!nombre || !apellido || !cedula || !telefono || !cuenta){
    errEl.textContent = 'Faltan datos obligatorios (*)';
    errEl.style.display='block'; return;
  }
  // VERIFICAR SI LA CUENTA YA EXISTE
  const {data: cuentaExiste} = await db.from('clientes').select('id, personas(nombre, apellido)').eq('nro_cuenta', cuenta).maybeSingle();
  if(cuentaExiste && cuentaExiste.id !== editandoClienteId){
    const dueno = cuentaExiste.personas ? cuentaExiste.personas.nombre + ' ' + cuentaExiste.personas.apellido : '';
    errEl.textContent = '⚠️ Número de cuenta ya se encuentra registrada. Verificar - La cuenta ' + cuenta + ' ya es de ' + dueno;
    errEl.style.display='block'; return;
  }
  
if(editandoPersonaId){
  const {error: e1} = await db.from('personas').update({nombre, apellido, cedula_ruc: cedula, telefono, direccion: direccion || null}).eq('id', editandoPersonaId);
  if(e1){ errEl.textContent = 'Error al actualizar: ' + e1.message; errEl.style.display='block'; return; }

  if(editandoClienteId){
    // Ya tenía cuenta, la actualiza
    await db.from('clientes').update({nro_cuenta: cuenta, numero_medidor: medidor}).eq('id', editandoClienteId);
  } else {
    // NO tenía cuenta, la crea ahora
    const {error: e2} = await db.from('clientes').insert({persona_id: editandoPersonaId, nro_cuenta: cuenta, numero_medidor: medidor, tipo_tarifa: 'fija', saldo_favor: 0, activo: true});
    if(e2){ errEl.textContent = 'Error al crear cuenta: ' + e2.message; errEl.style.display='block'; return; }
  }
   const mensajeFinal = '✅ Datos del Cliente Actualizado: ' + nombre + ' ' + apellido + ' - Cuenta ' + cuenta;
  cancelar(); // Primero limpia el formulario
  okEl.textContent = mensajeFinal; // Después pone el mensaje
  okEl.style.display = 'block'; // Y lo muestra
  actualizarContador();
  return;
}

  const {data: persona, error: e1} = await db.from('personas').insert({
    nombre: nombre,
    apellido: apellido,
    cedula_ruc: cedula,
    telefono: telefono,
    direccion: direccion || null
  }).select().single();

  if(e1){
    errEl.textContent = 'Error en persona: ' + e1.message;
    errEl.style.display='block'; return;
  }

  const {error: e2} = await db.from('clientes').insert({
    persona_id: persona.id,
    nro_cuenta: cuenta,
    numero_medidor: medidor,
    tipo_tarifa: 'fija',
    saldo_favor: 0,
    activo: true
  });

  if(e2){
    errEl.textContent = 'Error en cliente: ' + e2.message + ' (la persona quedó creada, revisá nro. cuenta duplicado)';
    errEl.style.display='block'; return;
  }

  okEl.textContent = '✅ Socio guardado: ' + nombre + ' ' + apellido + ' - Cuenta ' + cuenta + (medidor ? ' - Medidor ' + medidor : ' - Sin medidor');
  okEl.style.display='block';
  ['nombre','apellido','cedula','telefono','direccion','medidor'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('cuenta').value = String(Number(cuenta)+1).padStart(3,'0');
  document.getElementById('nombre').focus();
  actualizarContador();
}
</script>
</body>
</html>
