name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 12 */3 * *'
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar Supabase (solo lectura)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Faltan secrets SUPABASE_URL o SUPABASE_ANON_KEY"
            exit 1
          fi

          BASE_URL="${SUPABASE_URL%/}"
          STATUS=$(curl -sS -o /tmp/supabase_body.txt -w "%{http_code}" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "${BASE_URL}/rest/v1/cierres_mensuales?select=id&limit=1")

          echo "Respuesta HTTP de Supabase: $STATUS"
          cat /tmp/supabase_body.txt || true
          echo ""

          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            exit 1
          fi
