<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Junta de Saneamiento JSYBYPE</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #0f172a;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1e293b;
    }
    header h1 {
      font-size: 16px;
      font-weight: 800;
      color: #38bdf8;
    }
    header span {
      font-size: 12px;
      color: #94a3b8;
    }

    .layout {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    nav {
      width: 230px;
      background: #1e293b;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-right: 1px solid #334155;
    }
    .nav-btn {
      all: unset;
      cursor: pointer;
      padding: 12px 14px;
      border-radius: 10px;
      color: #cbd5e1;
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: background 0.15s, color 0.15s;
    }
    .nav-btn:hover {
      background: #334155;
      color: #ffffff;
    }
    .nav-btn.active {
      background: #2563eb;
      color: #ffffff;
    }
    .nav-btn.admin-login-btn {
      margin-top: auto;
      font-size: 12px;
      color: #94a3b8;
      border: 1px dashed #334155;
    }
    .seccion-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #64748b;
      margin: 10px 0 2px 6px;
      font-weight: 700;
    }
    .hidden {
      display: none !important;
    }

    main {
      flex: 1;
      background: #f1f5f9;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    @media (max-width: 768px) {
      .layout {
        flex-direction: column-reverse;
      }
      nav {
        width: 100%;
        flex-direction: row;
        justify-content: space-around;
        padding: 8px;
        border-right: none;
        border-top: 1px solid #334155;
      }
      .seccion-label { display: none; }
      .nav-btn {
        flex: 1;
        justify-content: center;
        text-align: center;
        padding: 10px 6px;
        font-size: 13px;
      }
      .nav-btn.admin-login-btn {
        margin-top: 0;
        flex: 0.8;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Junta JSYBYPE</h1>
    <span id="tituloVista">Portal del Socio</span>
  </header>

  <div class="layout">
    <nav id="menu">
      <div class="seccion-label">Socios</div>
      <button class="nav-btn active" data-src="./portal-cliente.html" data-titulo="Portal del Socio">
        💧 Portal Socio
      </button>

      <div id="labelAdmin" class="seccion-label hidden">Administración</div>
      <button id="btnCaja" class="nav-btn hidden" data-src="./admin-junta.html" data-titulo="Panel SuperAdmin">
        📊 Caja y Cobros
      </button>
      <button id="btnPadron" class="nav-btn hidden" data-src="./padron-clientes.html" data-titulo="Padrón de Socios">
        📋 Padrón
      </button>

      <button id="btnAccesoAdmin" class="nav-btn admin-login-btn" data-src="./admin-junta.html" data-titulo="Acceso Admin">
        🔐 Admin
      </button>
    </nav>

    <main>
      <iframe id="visor" src="./portal-cliente.html" title="Vista activa"></iframe>
    </main>
  </div>

  <script src="main.js"></script>
</body>
</html>
