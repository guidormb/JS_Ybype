<style>
  *{box-sizing:border-box}
  body{font-family:Arial, sans-serif; padding:16px; max-width:520px; margin:auto; background:#f5f5f5}
  h2{text-align:center; margin:10px 0 16px}
  label{font-size:13px; color:#555; font-weight:bold}
  select,button{padding:14px; margin:6px 0 12px; width:100%; font-size:16px; border-radius:10px; border:1px solid #ccc}
  button{background:#27ae60; color:white; border:none; font-weight:bold; cursor:pointer}
  button:active{opacity:0.8}
  .cerrar{background:#e74c3c}
  .volver{background:#555}
  .caja{background:white; border:1px solid #ddd; padding:16px; border-radius:12px; margin-top:15px}
  .fila{display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid #eee}
  .fila:last-child{border:none}

  .fila.destacada{background:#fff3cd; padding:8px 6px; border-radius:6px; font-weight:bold}
  .total{font-size:20px; text-align:center; margin:12px 0 4px}
  .total-propio{font-size:21px; text-align:center; margin:12px 0 4px; background:#e8f5e9; padding:10px; border-radius:8px; border:1px solid #a5d6a7}
  .nota{font-size:12px; color:#666; text-align:center}

    button, select, label, .no-print{display:none !important}
    body{background:white; padding:0}
    .caja{border:1px solid #000}
  }
  .parcial{background:#fff3cd; color:#856404; border:1px solid #ffeeba; padding:8px; border-radius:8px; text-align:center; font-weight:bold; font-size:13px; margin-bottom:10px}
  .definitivo{background:#d4edda; color:#155724; border:1px solid #c3e6cb; padding:8px; border-radius:8px; text-align:center; font-weight:bold; font-size:13px; margin-bottom:10px}
</style>

<body>
<h2>📊 Cierre Mensual</h2>
<div id="estado-sesion-cierre" class="no-print"></div>
<div class="no-print">
  <label for="mes">Mes</label>
  <select id="mes">
    <option value="1">Enero</option>
    <option value="2">Febrero</option>
    <option value="3">Marzo</option>
    <option value="4">Abril</option>
    <option value="5">Mayo</option>
    <option value="6">Junio</option>
    <option value="7">Julio</option>
    <option value="8">Agosto</option>
    <option value="9">Septiembre</option>
    <option value="10" selected>Octubre</option>
    <option value="11">Noviembre</option>
    <option value="12">Diciembre</option>
  </select>
  <label for="anio">Año</label>
  <select id="anio"></select>
  <button type="button" onclick="verResumen()">Ver Resumen</button>
</div>
<div id="resultado"></div>
<div class="no-print" style="margin-top:20px">
  <button type="button" class="volver" onclick="location.href='admin-junta.html'">⬅ Volver al Admin</button>
</div>
<script>
function poblarSelectorAnios() {
  const selAnio = document.getElementById('anio');
  if (!selAnio) return;
  const hoy = new Date();
  const anioActual = hoy.getFullYear();
  const anioInicio = 2026;
  const anioFin = Math.max(2028, anioActual + 1);
  selAnio.innerHTML = '';
  for (let a = anioInicio; a <= anioFin; a++) {
    const opt = document.createElement('option');
    opt.value = String(a);
    opt.textContent = String(a);
    if (a === anioActual) opt.selected = true;
    selAnio.appendChild(opt);
  }
}

async function verificarEstadoSesionCierre() {
  try {
    const sb = getSB();
    if (!sb?.auth) return;
    const { data } = await sb.auth.getSession();
    const user = data?.session?.user || null;
    const badge = document.getElementById('estado-sesion-cierre');
    if (!badge) return;

    if (user) {
      badge.textContent = 'Sesión activa: ' + (user.email || 'Admin');
      badge.className = 'text-center text-xs font-bold text-emerald-800 bg-emerald-100 border border-emerald-300 rounded-lg p-2 mb-3';
      badge.style.cssText = 'background:#d4edda;color:#155724;border:1px solid #c3e6cb;padding:8px;border-radius:8px;text-align:center;font-size:12px;font-weight:bold;margin-bottom:10px';
    } else {
      badge.textContent = 'Sin sesión activa: podés ver resúmenes, pero para Cerrar Mes debés iniciar sesión como Admin.';
      badge.style.cssText = 'background:#fff3cd;color:#856404;border:1px solid #ffeeba;padding:8px;border-radius:8px;text-align:center;font-size:12px;font-weight:bold;margin-bottom:10px';
    }
  } catch (e) {
    console.error('verificarEstadoSesionCierre:', e);
  }
}

// Anticipos pendientes AL CIERRE de ese mes: cobrados hasta fin de mes - usados hasta fin de mes
async function obtenerAnticiposPendientes(anio, mes){
  try{
    const ultimoDia = new Date(anio, mes, 0).getDate();
    const fechaFinISO = `${anio}-${String(mes).padStart(2,'0')}-${String(ultimoDia).padStart(2,'0')}T23:59:59.999Z`;
    const { data, error } = await getSB().from('pagos')
      .select('monto_pagado, factura_id, concepto, metodo, estado, created_at')
      .neq('estado', 'anulado')
      .lte('created_at', fechaFinISO);
    if(error) return 0;
    let cobrados = 0;
    let usados = 0;
    (data||[]).forEach(p => {
      if(p.estado === 'anulado') return;
      const conceptoLower = String(p.concepto || '').toLowerCase();
      const metodoLower = String(p.metodo || '').toLowerCase();
      const esAnticipo = !p.factura_id || conceptoLower.includes('anticipo');
      const esUsoSaldoFavor = metodoLower === 'saldo_a_favor' || conceptoLower.includes('saldo a favor');
      if(esAnticipo) cobrados += Number(p.monto_pagado||0);
      if(esUsoSaldoFavor && !esAnticipo) usados += Number(p.monto_pagado||0);
    });
    return Math.max(0, cobrados - usados);
  }catch(e){ return 0; }
}

// MISMA FORMULA QUE EL MENU - pagos.monto_pagado, metodo saldo_a_favor (excluyendo anulados)
async function obtenerFacturasConSaldo(anio, mes){
  try{
    const ultimoDia = new Date(anio, mes, 0).getDate();
    const fechaInicioISO = `${anio}-${String(mes).padStart(2,'0')}-01T00:00:00.000Z`;
    const fechaFinISO = `${anio}-${String(mes).padStart(2,'0')}-${String(ultimoDia).padStart(2,'0')}T23:59:59.999Z`;
    const { data, error } = await getSB().from('pagos')
      .select('monto_pagado, factura_id, concepto, metodo, estado, created_at')
      .neq('estado', 'anulado')
      .gte('created_at', fechaInicioISO)
      .lte('created_at', fechaFinISO);
    if(error) return 0;
    return (data||[]).reduce((acc,p)=>{
      if(p.estado === 'anulado') return acc;
      const conceptoLower = String(p.concepto || '').toLowerCase();
      const metodoLower = String(p.metodo || '').toLowerCase();
      const esUsoSaldoFavor = metodoLower === 'saldo_a_favor' || conceptoLower.includes('saldo a favor');
      const esAnticipo = !p.factura_id || conceptoLower.includes('anticipo');
      if(esUsoSaldoFavor && !esAnticipo){
        return acc + Number(p.monto_pagado||0);
      }
      return acc;
    }, 0);
  }catch(e){ return 0; }
}

async function verResumen(){
  const sb = getSB();
  const mes = Number(document.getElementById('mes').value);
  const anio = Number(document.getElementById('anio').value);
  const nombres = ['','Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  document.getElementById('resultado').innerHTML = '<p style="text-align:center">Cargando...</p>';
  const { data, error } = await sb.rpc('calcular_cierre', { p_anio: anio, p_mes: mes });
  if(error){
    document.getElementById('resultado').innerHTML = '';
    return alert('Error: ' + error.message);
  }
  const r = (data && data[0]) || { cobrado_facturas: 0, cobrado_anticipos: 0, total_cobrado: 0, total_gastado: 0, cantidad_pagos: 0, cantidad_gastos: 0 };
  const { data: cierreExistente } = await sb.from('cierres_mensuales').select('id').eq('anio', anio).eq('mes', mes).maybeSingle();
  const esParcial = !cierreExistente;
  const leyenda = esParcial ?
    `<div class="parcial">⚠️ REPORTE PARCIAL<br><span style="font-weight:normal; font-size:12px">Mes todavía no se cerró. Los números pueden cambiar.</span></div>` :
    `<div class="definitivo">✅ CIERRE DEFINITIVO - Mes cerrado</div>`;
  let mesAnt = mes - 1;
  let anioAnt = anio;
  if (mesAnt === 0) { mesAnt = 12; anioAnt = anio - 1; }
  const { data: cierreAnt } = await sb.from('cierres_mensuales').select('saldo_final').eq('anio', anioAnt).eq('mes', mesAnt).maybeSingle();
  const saldoAnterior = Number(cierreAnt?.saldo_final || 0);
  const cobradoFacturasEfectivo = Number(r.cobrado_facturas || 0);
  const cobradoAnticiposMes = Number(r.cobrado_anticipos || 0);
  const totalCobradoEfectivo = Number(r.total_cobrado || 0);
  const totalGastado = Number(r.total_gastado || 0);
  const facturasConSaldo = await obtenerFacturasConSaldo(anio, mes);
  const totalFacturasCobradas = cobradoFacturasEfectivo + facturasConSaldo;
  const saldoFinalCaja = saldoAnterior + totalCobradoEfectivo - totalGastado;
  const anticiposPendientes = await obtenerAnticiposPendientes(anio, mes);
  const saldoPropio = saldoFinalCaja - anticiposPendientes;
  const fmt = (n) => Number(n || 0).toLocaleString('es-PY');
  const leyendaSaldo = saldoPropio < 0
    ? `<div class="leyenda-saldo">⚠️ Caja sin plata propia. En caja hay Gs. ${fmt(saldoFinalCaja)}, pero se deben Gs. ${fmt(anticiposPendientes)} de anticipos. Faltan Gs. ${fmt(Math.abs(saldoPropio))} para cubrirlos.</div>`
    : `<div class="leyenda-saldo">ℹ️ De los fondos en caja, Gs. ${fmt(anticiposPendientes)} son anticipos de socios (plata a descontar, no ganancia). Lo propio de la Junta es Gs. ${fmt(saldoPropio)}.</div>`;
  const botonCerrar = esParcial ?
    `<button type="button" onclick="cerrarMes(${anio}, ${mes}, ${cobradoFacturasEfectivo}, ${cobradoAnticiposMes}, ${totalGastado}, ${saldoFinalCaja})" style="width:100%; padding:14px; background:#dc3545; color:white; border:none; border-radius:8px; font-size:16px; font-weight:bold; margin-top:15px">🔒 Cerrar Mes</button>` :
    `<div style="background:#d4edda; color:#155724; padding:12px; border-radius:8px; text-align:center; font-weight:bold; margin-top:15px">✅ Este mes ya está cerrado. No se puede volver a cerrar.</div>`;
  document.getElementById('resultado').innerHTML = `
    <div class="caja">
    ${leyenda}
      <h3 style="text-align:center; margin:0">JUNTA JSYBYPE</h3>
      <p style="text-align:center; margin:4px 0 12px"><b>CIERRE ${nombres[mes].toUpperCase()} ${anio}</b></p>
      <div class="fila"><span>Saldo mes anterior:</span><b>Gs. ${fmt(saldoAnterior)}</b></div>
      <div class="fila sub"><span>Cobrado Facturas en efectivo:</span><b>Gs. ${fmt(cobradoFacturasEfectivo)}</b></div>
      <div class="fila sub"><span>Cobrado Facturas con saldo:</span><b>Gs. ${fmt(facturasConSaldo)}</b></div>
      <div class="fila"><span>Total Facturas Cobradas:</span><b>Gs. ${fmt(totalFacturasCobradas)}</b></div>
      <div class="fila"><span>Cobrado Anticipos del mes:</span><b>Gs. ${fmt(cobradoAnticiposMes)}</b></div>
      <div class="fila"><span>Total Cobrado en EFECTIVO:</span><b>Gs. ${fmt(totalCobradoEfectivo)}</b></div>
      <div class="fila"><span>Total Gastado:</span><b>Gs. ${fmt(totalGastado)}</b></div>
      <h3 class="total">Saldo Final en Caja: Gs. ${fmt(saldoFinalCaja)}</h3>
      <div class="fila destacada"><span>Menos Anticipos / Saldo de socios:</span><b>Gs. ${fmt(anticiposPendientes)}</b></div>
      <h3 class="total-propio">SALDO PROPIO DE LA JUNTA: Gs. ${fmt(saldoPropio)}</h3>
      ${leyendaSaldo}
      <p class="nota">Cantidad pagos: ${r.cantidad_pagos} | Gastos: ${r.cantidad_gastos}</p>
      <p class="nota">Regla: el mes anterior se cierra el 15. Cobrar deuda vieja siempre se puede. Lo que se bloquea es anular / borrar.</p>
    </div>
    <div class="no-print">
      ${botonCerrar}
      <button type="button" onclick="window.print()">📄 Generar PDF</button>
    </div>
  `;
}

async function cerrarMes(anio, mes, cf, ca, tg, saldo) {
  const sb = getSB();
  const { data: sesData } = await sb.auth.getSession();
  if (!sesData?.session) {
    return alert('Iniciá sesión como administrador para cerrar el mes.');
  }
  const fechaPermitida = new Date(anio, mes, 15);
  const hoy = new Date();
  hoy.setHours(0, 0, 0, 0);
  if (hoy < fechaPermitida) {
    const nombres = ['', 'Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
    const mesSiguiente = mes === 12 ? 'Enero' : nombres[mes + 1];
    return alert(`No se puede cerrar todavía.\n\n${nombres[mes]} ${anio} solo se puede cerrar desde el 15 de ${mesSiguiente}.`);
  }
  if (!confirm('¿Cerrar este mes? Después del 15 ya no se podrá anular nada de este mes.')) return;
  const { data: yaCerrado } = await sb.from('cierres_mensuales').select('id').eq('anio', anio).eq('mes', mes).maybeSingle();
  if (yaCerrado) return alert('Este mes ya está cerrado. No se puede volver a cerrar.');
  const { error } = await sb.from('cierres_mensuales').insert({
    anio: anio,
    mes: mes,
    fecha_cierre: new Date().toISOString().split('T')[0],
    total_cobrado_facturas: cf,
    total_anticipos: ca,
    total_gastado: tg,
    saldo_final: saldo
  });
  if (error) return alert('Error al cerrar: ' + error.message);
  alert('¡Mes cerrado y guardado!');
  verResumen();
}

poblarSelectorAnios();
verificarEstadoSesionCierre();
</script>
</body>
